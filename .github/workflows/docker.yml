name: Build submission container

# The model weights are ~822 MB, far past GitHub's file limits, so they live as a
# release asset instead of in the tree. This workflow fetches them, builds the ISIC
# submission image, and publishes it.
#
# Setup (once):
#   1. Upload weights_bundle.tar.gz to a release tagged `weights-v1`
#        gh release create weights-v1 /tmp/weights_bundle.tar.gz \
#            --title "Model weights" --notes "fp16 EMA weights, 5-fold x 2 models"
#   2. Optional, for Docker Hub: add repository secrets DOCKERHUB_USERNAME and
#      DOCKERHUB_TOKEN (Docker Hub > Account Settings > Personal access tokens).
#      Without them the job still publishes to GHCR, which needs no configuration.
#
# Run: Actions tab > "Build submission container" > Run workflow.

on:
  workflow_dispatch:
    inputs:
      weights_tag:
        description: Release tag holding weights_bundle.tar.gz
        default: weights-v1
        required: true
  push:
    tags: ['v*']

env:
  WEIGHTS_TAG: ${{ github.event.inputs.weights_tag || 'weights-v1' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The runner has ~14 GB free; torch CPU wheels plus the weights layer fit, but
      # dropping preinstalled toolchains buys headroom cheaply.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Fetch model weights from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$WEIGHTS_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'weights_bundle.tar.gz' --dir .
          # The release tarball also contains a manifest.json, but the repository's
          # copy is authoritative: it encodes the blend recipe and thresholds, which
          # are reviewed in code review and change far more often than the weights.
          # Restoring it here means the recipe can be corrected without re-uploading
          # 758 MB of unchanged .pt files.
          cp weights_bundle/manifest.json /tmp/manifest.repo.json
          tar -xzf weights_bundle.tar.gz
          rm weights_bundle.tar.gz
          cp /tmp/manifest.repo.json weights_bundle/manifest.json

          test -f weights_bundle/manifest.json || { echo "manifest.json missing"; exit 1; }
          python -c "
          import json
          m = json.load(open('weights_bundle/manifest.json'))
          missing = [f for r in m['runs'] for f in r['folds']
                     if not __import__('os').path.exists('weights_bundle/' + f)]
          assert not missing, f'manifest references absent weight files: {missing}'
          b = m['blend']
          assert b['method'] == 'mean', f\"expected mean blending, got {b['method']!r}\"
          print(f\"manifest OK: {sum(len(r['folds']) for r in m['runs'])} weights, \"
                f\"blend={b['method']}, strategy={b['strategy']}\")
          "
          echo "weights: $(du -sh weights_bundle | cut -f1), $(ls weights_bundle/*.pt | wc -l) file(s)"

      - uses: docker/setup-buildx-action@v3

      # GHCR needs no secrets — the built-in token is enough.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check for Docker Hub credentials
        id: hub
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub secrets absent - publishing to GHCR only."
          fi

      - name: Log in to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compose image tags
        id: tags
        run: |
          # Registry paths must be lowercase.
          GHCR="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')/milk10k"
          TAGS="${GHCR}:latest,${GHCR}:${GITHUB_SHA::7}"
          if [ "${{ steps.hub.outputs.enabled }}" = "true" ]; then
            TAGS="${TAGS},${{ secrets.DOCKERHUB_USERNAME }}/milk10k:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Publishing: $TAGS"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test the published image against a synthetic /images tree, so a broken
      # entrypoint is caught here rather than by the challenge grader.
      - name: Smoke test
        run: |
          IMAGE=$(echo "${{ steps.tags.outputs.tags }}" | cut -d, -f1)
          mkdir -p /tmp/images/IL_0000001 /tmp/images/IL_0000002

          # Build the fixture JPEGs with the image's OWN python, not the runner's.
          # The runner's interpreter has neither numpy nor cv2, and installing them
          # here just to fabricate test data adds a failure mode unrelated to the
          # thing under test.
          docker run --rm --entrypoint python -v /tmp/images:/images "$IMAGE" -c "
          import numpy as np, cv2, pathlib
          rng = np.random.default_rng(0)
          for d in sorted(pathlib.Path('/images').iterdir()):
              for n in ('ISIC_0000001', 'ISIC_0000002'):
                  cv2.imwrite(str(d / f'{n}.jpg'), rng.integers(0, 255, (450, 600, 3), dtype=np.uint8))
          print('fixtures written', flush=True)
          "

          docker run --rm -v /tmp/images:/images "$IMAGE" > /tmp/out.csv
          echo "--- stdout ---"; cat /tmp/out.csv

          # Validate with the runner's plain python: csv is stdlib, so this step has
          # no third-party dependencies at all.
          python - <<'PY'
          import csv
          EXPECT = ["image","AKIEC","BCC","BEN_OTH","BKL","DF","INF","MAL_OTH","MEL","NV","SCCKA","VASC"]
          rows = list(csv.reader(open('/tmp/out.csv')))
          assert rows, "no output on stdout"
          assert rows[0] == EXPECT, f"bad header: {rows[0]}"
          assert len(rows) == 3, f"expected 2 lesion rows, got {len(rows) - 1}"
          for r in rows[1:]:
              vals = [float(v) for v in r[1:]]
              assert len(vals) == 11, f"expected 11 scores, got {len(vals)}: {r}"
              assert all(0.0 <= v <= 1.0 for v in vals), f"score out of [0,1]: {r}"
          ids = [r[0] for r in rows[1:]]
          assert ids == ["IL_0000001", "IL_0000002"], f"lesion grouping wrong: {ids}"
          print("smoke test OK: header, 2 lesion rows, 11 probabilities in [0,1], correct lesion ids")
          PY

      - name: Summary
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n'
            echo '```'
            echo "Paste the Docker Hub tag into the ISIC submission form."
          } >> "$GITHUB_STEP_SUMMARY"
